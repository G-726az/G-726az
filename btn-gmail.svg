<svg xmlns="http://www.w3.org/2000/svg" width="240" height="60" viewBox="0 0 240 60">
<defs>
 <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#EA4335"/><stop offset=".5" stop-color="#FBBC04"/><stop offset="1" stop-color="#EA4335"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="3s" repeatCount="indefinite"/>
 </linearGradient>
 <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
 </linearGradient>
 <clipPath id="cp"><rect x="2" y="2" width="236" height="56" rx="28.0"/></clipPath>
</defs>
<style>
 .in{opacity:0;animation:in .7s cubic-bezier(.2,.8,.2,1) .1s forwards}
 .ic{animation:bob 2.4s ease-in-out infinite;transform-origin:34px 30px}
 .sh{animation:sweep 3.2s ease-in-out infinite}
 .glow{animation:glow 2.4s ease-in-out infinite}
 .t{fill:#e6edf3;font:700 17px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;letter-spacing:.4px}
 .s{fill:#8b93b3;font:500 11.5px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif}
 .ar{animation:arr 1.6s ease-in-out infinite}
 @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
 @keyframes bob{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.1) rotate(-6deg)}}
 @keyframes sweep{0%{transform:translateX(-140px)}60%,100%{transform:translateX(280px)}}
 @keyframes glow{0%,100%{opacity:.25}50%{opacity:.7}}
 @keyframes arr{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
</style>
<g class="in">
 <rect x="2" y="2" width="236" height="56" rx="28.0" fill="#1a1b27"/>
 <circle class="glow" cx="34" cy="30" r="20" fill="#EA4335" opacity=".3"/>
 <g clip-path="url(#cp)"><rect class="sh" x="0" y="0" width="100" height="60" fill="url(#sh)" transform="skewX(-20)"/></g>
 <rect x="2" y="2" width="236" height="56" rx="28.0" fill="none" stroke="url(#bd)" stroke-width="2.5"/>
 <g class="ic"><image href="data:image/svg+xml;base64," x="20" y="16" width="28" height="28"/></g>
 <text class="t" x="62" y="28">Gmail</text>
 <text class="s" x="62" y="44">Escríbeme un correo</text>
 <g class="ar"><path d="M202 24l7 6-7 6" fill="none" stroke="#FBBC04" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
</g></svg>